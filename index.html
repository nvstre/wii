<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8eeec">
  <!-- Replace "Your Name" and the description with your own; og:image works best as a full URL once deployed -->
  <title>Your Name · Portfolio</title>
  <meta name="description" content="Portfolio of Your Name, presented as a Wii U Menu.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Your Name · Portfolio">
  <meta property="og:description" content="Portfolio of Your Name, presented as a Wii U Menu.">
  <meta property="og:image" content="media/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="arrow-fill" x1="0" y1="0" x2="0.35" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="0.5" stop-color="#f7f8f8"/>
        <stop offset="0.51" stop-color="#e6eaea"/>
        <stop offset="1" stop-color="#f0f2f2"/>
      </linearGradient>
      <linearGradient id="arrow-shine" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <symbol id="arrow-shape" viewBox="0 0 110 196">
        <path d="M17 8Q9 3 10 14Q30 98 10 182Q9 193 17 188L101 106Q107 98 101 90Z" fill="url(#arrow-fill)" stroke="#c3cbcb" stroke-width="1.5"/>
        <path d="M20 15Q15 12 16 20Q27 62 25 96L93 96Z" fill="url(#arrow-shine)"/>
        <path d="M17 10Q11 7 12 15" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <div class="bg" id="bg" aria-hidden="true">
    <video class="bg-video" muted playsinline preload="auto"></video>
    <video class="bg-video" muted playsinline preload="auto"></video>
  </div>

  <main class="menu" aria-label="Wii U Menu">
    <button class="user glass" id="user" type="button" aria-label="User">
      <span class="user-avatar" id="userAvatar"></span>
      <span class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M5 9.5a10 10 0 0 1 14 0M8 12.5a6 6 0 0 1 8 0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M7 21v-4.5a5 5 0 0 1 10 0V21h-3.2v-4.5a1.8 1.8 0 0 0-3.6 0V21z" fill="#fff"/></svg>
      </span>
    </button>

    <nav class="dots" id="dots" aria-label="Pages"></nav>

    <button class="mute glass" id="mute" type="button" aria-label="Mute sound" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="speaker" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>
        <path class="waves" d="M15 9a4 4 0 0 1 0 6M17.5 6.5a7.5 7.5 0 0 1 0 11"/>
        <path class="cross" d="M15.5 9.5l5 5M20.5 9.5l-5 5"/>
      </svg>
    </button>

    <section class="viewport" id="viewport">
      <div class="track" id="track"></div>
    </section>

    <button class="arrow prev" id="prev" type="button" aria-label="Previous page">
      <svg aria-hidden="true"><use href="#arrow-shape"/></svg>
    </button>
    <button class="arrow next" id="next" type="button" aria-label="Next page">
      <svg aria-hidden="true"><use href="#arrow-shape"/></svg>
    </button>

    <footer class="dock" id="dock"></footer>
    <button class="corner-left" id="cornerLeft" type="button"></button>
    <button class="corner-right glass" id="cornerRight" type="button"></button>
  </main>

  <section class="tv" id="tv" aria-label="TV screen" hidden>
    <div class="tv-hero glass">
      <div class="mii-frame" id="tvMii"></div>
      <h1 id="tvName"></h1>
      <p id="tvTagline"></p>
      <button class="pill primary" id="tvMenu" type="button">Open the Menu</button>
    </div>
    <div class="tv-bubbles" id="tvBubbles"></div>
  </section>

  <div class="folder-view" id="folderView" hidden>
    <div class="folder-panel glass" role="dialog" aria-modal="true" aria-labelledby="folderTitle">
      <header class="folder-head">
        <span class="folder-swatch" id="folderSwatch" aria-hidden="true"></span>
        <h2 id="folderTitle"></h2>
        <button class="pill" id="folderClose" type="button">Close</button>
      </header>
      <div class="folder-grid" id="folderGrid"></div>
    </div>
  </div>

  <div class="launch" id="launch" role="dialog" aria-modal="true" aria-labelledby="launchTitle" hidden>
    <div class="launch-splash" id="launchSplash" aria-hidden="true"></div>
    <header class="launch-bar">
      <span class="launch-icon" id="launchIcon" aria-hidden="true"></span>
      <h1 class="launch-title" id="launchTitle"></h1>
    </header>
    <div class="launch-body" id="launchBody"></div>
    <footer class="launch-foot">
      <button class="pill back" id="launchBack" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Back
      </button>
      <button class="home-btn" id="launchClose" type="button" aria-label="HOME Menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 11h3v9h4v-6h4v6h4v-9h3z"/></svg>
      </button>
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
