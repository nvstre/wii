<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ececec">
  <title>Wii U Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="menu" id="menu" aria-label="Wii U Menu">
    <header class="topbar">
      <button class="user" id="user" type="button" aria-label="User">
        <span class="user-avatar" id="userAvatar"></span>
      </button>
      <div class="title" id="title" aria-live="polite"></div>
      <button class="swap" id="swap" type="button" aria-label="Switch screens">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="4" y="9" width="24" height="16" rx="2.5"/>
          <rect x="20" y="25" width="24" height="14" rx="4"/>
          <path d="M34 8h4a3 3 0 0 1 3 3v6m0 0-3-3m3 3 3-3M14 40h-4a3 3 0 0 1-3-3v-6m0 0-3 3m3-3 3 3" class="arrows"/>
        </svg>
      </button>
    </header>

    <nav class="dots" id="dots" aria-label="Pages"></nav>

    <section class="viewport" id="viewport">
      <div class="track" id="track"></div>
      <button class="arrow prev" id="prev" type="button" aria-label="Previous page">
        <svg viewBox="0 0 24 48" aria-hidden="true"><path d="M18 6 6 24l12 18"/></svg>
      </button>
      <button class="arrow next" id="next" type="button" aria-label="Next page">
        <svg viewBox="0 0 24 48" aria-hidden="true"><path d="M6 6l12 18L6 42"/></svg>
      </button>
    </section>

    <footer class="dock" id="dock"></footer>
  </main>

  <div class="launch" id="launch" role="dialog" aria-modal="true" aria-labelledby="launchTitle" hidden>
    <div class="launch-bar">
      <h1 class="launch-title" id="launchTitle"></h1>
      <button class="launch-close" id="launchClose" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 11h3v9h4v-6h4v6h4v-9h3z"/></svg>
      </button>
    </div>
    <div class="launch-body" id="launchBody"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
